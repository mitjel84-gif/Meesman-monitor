name: Update Meesman koersen

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 6'

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Benodigde pakketten installeren
        run: pip install openpyxl requests

      - name: Meesman koersen bijwerken
        run: python scripts/update_prices.py

      - name: Wijzigingen opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fund-prices.json public/data/fund-dividends.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Meesman serie A koersen"
            git push
          fi
