name: Update aandelenkoersen Top 100

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 1-5'

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Benodigde pakketten installeren
        run: pip install yfinance pandas

      - name: Aandelenkoersen bijwerken
        run: python scripts/update_stock_prices.py

      - name: Resultaten opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/stock-rankings.json
          if ! git diff --cached --quiet; then
            git commit -m "Update aandelenrendementen Top 100"
            git push
          fi
